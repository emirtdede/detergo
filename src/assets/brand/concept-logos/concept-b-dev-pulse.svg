<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="dp-bg-glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Wing 1 Gradient (Vellium Purple to Neon Indigo) -->
    <linearGradient id="dp-wing-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Wing 2 Gradient (Electric Cyan to Aqua Sweep) -->
    <linearGradient id="dp-wing-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Clean Glow -->
    <filter id="dp-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Container Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#dp-bg-glow)" stroke="#1e293b" stroke-width="4" />

  <g filter="url(#dp-bloom)">
    <!-- Aerodynamic DV Code Delta Wings -->
    <!-- Left Wing (The 'D' stem & 'V' descent) -->
    <path d="M 140 120 
             L 220 120 
             L 280 256 
             L 220 392 
             L 140 392 
             L 200 256 Z" 
          fill="url(#dp-wing-left)" 
          opacity="0.95" />

    <!-- Right Intersecting Chevron (The Forward Clean Vector) -->
    <path d="M 230 120 
             L 310 120 
             L 380 256 
             L 310 392 
             L 230 392 
             L 300 256 Z" 
          fill="url(#dp-wing-right)" 
          opacity="0.95" />

    <!-- Central Precision Diamond Core -->
    <polygon points="256,224 288,256 256,288 224,256" fill="#FFFFFF" />

    <!-- Velocity Light Trails (Purification stream) -->
    <line x1="120" y1="256" x2="160" y2="256" stroke="#A855F7" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="390" y1="200" x2="420" y2="200" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="390" y1="312" x2="420" y2="312" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" opacity="0.7" />

    <!-- Sparkle Accent -->
    <path d="M 374 140 Q 388 140 388 126 Q 388 140 402 140 Q 388 140 388 154 Q 388 140 374 140 Z" fill="#FFFFFF" />
  </g>
</svg>

