<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dc-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="dc-spark-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="dc-inner-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="dc-glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagon Outer Shield -->
  <polygon points="60,8 106,34 106,86 60,112 14,86 14,34" 
           fill="url(#dc-inner-1)" stroke="url(#dc-grad-1)" stroke-width="5" stroke-linejoin="round" />
  <!-- Inner Developer Facets & < / > Sweep -->
  <path d="M42 46 L28 60 L42 74" fill="none" stroke="#F1F5F9" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M78 46 L92 60 L78 74" fill="none" stroke="#F1F5F9" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="67" y1="41" x2="53" y2="79" stroke="url(#dc-grad-1)" stroke-width="5.5" stroke-linecap="round" />
  <!-- Dynamic Clean Sparkle -->
  <path d="M60 22 L62.5 29.5 L70 32 L62.5 34.5 L60 42 L57.5 34.5 L50 32 L57.5 29.5 Z" fill="url(#dc-spark-1)" filter="url(#dc-glow-1)" />
</svg>
