<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="kn-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Disk Ring Gradients -->
    <linearGradient id="kn-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="kn-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="kn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#kn-bg)" stroke="#1e293b" stroke-width="4" />

  <g filter="url(#kn-glow)">
    <!-- Outer Precision Drive Aperture / Orbital Disk Track -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="12" />
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#kn-ring-grad)" stroke-width="12" stroke-dasharray="140 60 220 80" stroke-linecap="round" />

    <!-- Secondary Clean Track -->
    <circle cx="256" cy="256" r="116" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 12" />

    <!-- 4-Point Primary Kinetic Star / Laser Beam -->
    <path d="M 256 100 
             Q 256 256 100 256 
             Q 256 256 256 412 
             Q 256 256 412 256 
             Q 256 256 256 100 Z" 
          fill="url(#kn-star-grad)" />

    <!-- 4-Point Secondary Diagonal Diamond Star (Cross Purifier) -->
    <path d="M 256 168 
             Q 256 256 168 256 
             Q 256 256 256 344 
             Q 256 256 344 256 
             Q 256 256 256 168 Z" 
          fill="#FFFFFF" 
          opacity="0.85" 
          transform="rotate(45 256 256)" />

    <!-- Center Vacuum Singularity / Absolute Zero Core -->
    <circle cx="256" cy="256" r="14" fill="#020408" stroke="#38BDF8" stroke-width="4" />
    <circle cx="256" cy="256" r="5" fill="#FFFFFF" />

    <!-- Outer Precision Orbit Dots (Cleaned Sectors) -->
    <circle cx="256" cy="72" r="5" fill="#38BDF8" />
    <circle cx="440" cy="256" r="5" fill="#38BDF8" />
    <circle cx="256" cy="440" r="5" fill="#0284C7" />
    <circle cx="72" cy="256" r="5" fill="#0284C7" />
  </g>
</svg>

