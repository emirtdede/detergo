# Intentionally minimal and machine-independent.
#
# An earlier revision pinned `target-dir` to a developer-specific temp folder and
# hard-coded MSVC/SDK `LIBPATH` entries. That made the release build
# unreproducible on any other machine: cargo wrote outside the repo and the
# linker searched paths that only existed on one workstation. The toolchain is
# now discovered the normal way, and a non-default artifact directory can still
# be requested with the standard `CARGO_TARGET_DIR` environment variable.
[build]
