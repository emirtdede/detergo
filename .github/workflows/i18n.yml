name: i18n integrity gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The script-integrity audit only needs Node built-ins, but the key
      # coverage audit parses the TypeScript dictionaries and therefore needs
      # the `typescript` dev dependency.
      - run: npm ci
      - run: npm run check:i18n
