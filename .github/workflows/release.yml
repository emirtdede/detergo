name: Release provenance

# `check:build-info` and `check:exe-icons` can only run after a real release
# build: the first needs `release_output/BUILD_INFO.json`, the second needs the
# compiled executable. Keeping them out of `ci.yml` means a pull request never
# fails for a missing artifact, while a tag build can never publish an
# untraceable package.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      allow_dirty:
        description: "Build from a dirty tree (never publishable)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run typecheck
      - run: npm run check-version
      - run: npm run check:languages

      - name: Release build
        shell: pwsh
        run: |
          if ("${{ inputs.allow_dirty }}" -eq "true") {
            npm run build:release -- --allow-dirty
          } else {
            npm run build:release
          }

      - name: Build provenance
        if: ${{ inputs.allow_dirty != true }}
        run: npm run check:build-info

      - name: Embedded icon frames
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/dev-cleaner.exe"
          if (-not (Test-Path $exe)) { throw "Release executable not found: $exe" }
          npm run check:exe-icons -- $exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-output
          path: release_output
          if-no-files-found: error

      # A tag build must not stop at an Actions artifact: attach the signed-out
      # installers, the portable binary and the provenance manifest to the
      # GitHub Release for that tag, and generate notes from the commit range.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release_output/*.exe
            release_output/*.msi
            release_output/SHA256SUMS.txt
            release_output/BUILD_INFO.json
