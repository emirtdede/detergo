name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Version consistency
        run: npm run check-version
      - name: Audit invariants
        run: npm run check:audit
      - name: Production build
        run: npm run build
      - name: Regression gates
        run: npm run check:gates
      - name: Icon structure
        run: npm run check:icons
      - name: Brand integrity
        run: npm run check:brand
      - name: Installer language catalog
        run: npm run check:languages
      - name: i18n integrity
        run: npm run check:i18n
      - name: Prettier
        run: npm run format:check

  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # `--locked` is mandatory: CI must build the committed dependency graph,
      # not silently resolve new versions. A Cargo.toml edit without a matching
      # Cargo.lock update fails here instead of drifting between machines.
      - name: Dependency lock check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # T-37: the generated contract in `src/lib/tauri/bindings.ts` must match
      # the Rust IPC types. Regenerating in the CI workspace and diffing catches
      # a changed Rust field before the frontend silently drifts.
      - name: TypeScript bindings drift
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --features bindings --bin export_bindings -- --check
