# Node Cleaner target catalog
#
# Every rule is validated at startup. A rule that fails validation disables the
# cleanup engine entirely (fail-closed). `min_evidence` counts independent
# evidence sources: the directory/file name is always one, a project marker is
# the second, an internal content signature is the third.
schema_version = 1

# ---------------------------------------------------------------------------
# JavaScript / TypeScript
# ---------------------------------------------------------------------------

[[rules]]
id = "js.node_modules"
ecosystem = "javascript"
category = "dependencies"
kind = "directory"
names = ["node_modules"]
markers = ["package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock", "bun.lockb", "pnpm-workspace.yaml", "lerna.json", "nx.json", "turbo.json"]
min_evidence = 1
safety = "regenerate"
confidence = "high"
cleanup = "trash"
regenerate = "npm install / pnpm install / yarn install / bun install"
content = [".package-lock.json", ".pnpm", ".modules.yaml", "package.json", ".yarn-state.yml"]
note = "Dependency tree; reconstructible only with a package manifest and lockfile."

[[rules]]
id = "js.next"
ecosystem = "javascript"
category = "build"
kind = "directory"
names = [".next"]
markers = ["next.config.js", "next.config.mjs", "next.config.ts", "next.config.cjs"]
min_evidence = 1
safety = "regenerate"
cleanup = "trash"
regenerate = "next build"
child_rules = ["js.next_cache"]

[[rules]]
id = "js.next_cache"
ecosystem = "javascript"
category = "cache"
kind = "directory"
names = ["cache"]
nested_in = ["js.next"]
markers = ["next.config.js", "next.config.mjs", "next.config.ts", "next.config.cjs"]
min_evidence = 1
safety = "safe"
cleanup = "trash"
regenerate = "next build"

