# ---------------------------------------------------------------------------
# Mobile (iOS / macOS)
# ---------------------------------------------------------------------------

[[rules]]
id = "ios.pods"
ecosystem = "swift"
category = "dependencies"
kind = "directory"
names = ["Pods"]
markers = ["Podfile"]
generic_name = true
min_evidence = 2
safety = "regenerate"
cleanup = "trash"
regenerate = "pod install"
git_policy = "denytracked"

[[rules]]
id = "ios.carthage"
ecosystem = "swift"
category = "dependencies"
kind = "directory"
names = ["Carthage"]
markers = ["Cartfile", "Cartfile.resolved"]
generic_name = true
min_evidence = 2
safety = "review"
cleanup = "trash"
regenerate = "carthage bootstrap"
git_policy = "denytracked"

# ---------------------------------------------------------------------------
# Infrastructure as Code & Cloud / Serverless
# ---------------------------------------------------------------------------

[[rules]]
id = "iac.terraform"
ecosystem = "devops"
category = "dependencies"
kind = "directory"
names = [".terraform"]
markers = ["*.tf", "*.tf.json", ".terraform.lock.hcl"]
min_evidence = 1
safety = "regenerate"
cleanup = "trash"
regenerate = "terraform init"
note = "Downloaded Terraform providers and modules; state files outside .terraform are untouched."

[[rules]]
id = "iac.terragrunt"
ecosystem = "devops"
category = "cache"
kind = "directory"
names = [".terragrunt-cache"]
markers = ["terragrunt.hcl"]
min_evidence = 1
safety = "safe"
cleanup = "trash"
regenerate = "terragrunt init"

[[rules]]
id = "cloud.cdk_out"
ecosystem = "devops"
category = "build"
kind = "directory"
names = ["cdk.out"]
markers = ["cdk.json"]
min_evidence = 1
safety = "regenerate"
cleanup = "trash"
regenerate = "cdk synth"

[[rules]]
id = "cloud.aws_sam"
ecosystem = "devops"
category = "build"
kind = "directory"
names = [".aws-sam"]
markers = ["template.yaml", "template.yml", "samconfig.toml"]
min_evidence = 1
safety = "regenerate"
cleanup = "trash"
regenerate = "sam build"

[[rules]]
id = "cloud.serverless"
ecosystem = "devops"
category = "build"
kind = "directory"
names = [".serverless"]
markers = ["serverless.yml", "serverless.yaml", "serverless.ts"]
min_evidence = 1
safety = "regenerate"
cleanup = "trash"
regenerate = "serverless package"

# ---------------------------------------------------------------------------
# Haskell
# ---------------------------------------------------------------------------

[[rules]]
id = "haskell.stack_work"
ecosystem = "haskell"
category = "build"
kind = "directory"
names = [".stack-work"]
markers = ["stack.yaml"]
min_evidence = 1
safety = "regenerate"
cleanup = "trash"
regenerate = "stack build"

[[rules]]
id = "haskell.dist_newstyle"
ecosystem = "haskell"
category = "build"
kind = "directory"
names = ["dist-newstyle"]
markers = ["*.cabal", "cabal.project"]
min_evidence = 1
safety = "regenerate"
cleanup = "trash"
regenerate = "cabal build"
