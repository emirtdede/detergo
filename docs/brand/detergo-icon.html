<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detergo - Uygulama İkonu</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(ellipse at 50% 30%, #262730 0%, #131419 55%, #09090b 100%);
        color: #f7f7f8;
        padding: 30px;
      }
      .preview {
        width: min(80vw, 450px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }
      .preview svg {
        width: 100%;
        height: 100%;
      }
      h1 {
        font-size: 22px;
        letter-spacing: -0.6px;
        margin: 0;
        font-weight: 650;
      }
      p {
        font-size: 14px;
        color: #a4a6ae;
        margin: 0;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 5px;
      }
      button {
        cursor: pointer;
        border: 1px solid #3d3f46;
        border-radius: 10px;
        background: #24262e;
        color: white;
        padding: 12px 20px;
        font-weight: 600;
        font-size: 13px;
      }
      button:hover {
        background: #353741;
      }
      button:first-child {
        background: #f5f5f6;
        color: #141416;
        border-color: transparent;
      }
      button:first-child:hover {
        background: #dadadd;
      }
    </style>
  </head>
  <body>
    <div class="preview" id="icon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 512 512"
        width="100%"
        height="100%"
        fill="none"
      >
        <!-- Detergo (Slash & Spark) - Obsidian Dark App Icon -->
        <defs>
          <linearGradient
            id="bg-grad-1-dark"
            x1="256"
            y1="32"
            x2="256"
            y2="480"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0%" stop-color="#1C1C21" />
            <stop offset="45%" stop-color="#0D0D10" />
            <stop offset="100%" stop-color="#050507" />
          </linearGradient>
          <linearGradient
            id="rim-grad-1-dark"
            x1="256"
            y1="32"
            x2="256"
            y2="480"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
            <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
          </linearGradient>
        </defs>

        <!-- Base Obsidian Squircle -->
        <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg-grad-1-dark)" />

        <!-- Inner Specular Rim Highlight -->
        <rect
          x="34"
          y="34"
          width="444"
          height="444"
          rx="106"
          stroke="url(#rim-grad-1-dark)"
          stroke-width="4"
        />

        <!-- Subtle Inner Technical Track -->
        <rect
          x="56"
          y="56"
          width="400"
          height="400"
          rx="86"
          stroke="#FFFFFF"
          stroke-opacity="0.04"
          stroke-width="2"
        />

        <!-- Left Angle Bracket (<) moved farther left -->
        <path
          d="M166 172L86 256L166 340"
          stroke="#FFFFFF"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <!-- Right Angle Bracket (>) moved farther right -->
        <path
          d="M346 172L426 256L346 340"
          stroke="#FFFFFF"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <!-- Forward Slash (/) shortened by 8%, center unchanged -->
        <path
          d="M225.5 336.1L259.6 246.5"
          stroke="#FFFFFF"
          stroke-width="34"
          stroke-linecap="round"
        />

        <!-- Single 4-Point Spark (✦), 12% larger at same center (283.4,184) -->
        <path
          d="M283.4 146C283.4 173.8 293.6 184 321.4 184C293.6 184 283.4 194.2 283.4 222C283.4 194.2 273.2 184 245.4 184C273.2 184 283.4 173.8 283.4 146Z"
          fill="#FFFFFF"
        />
      </svg>
    </div>
    <h1>Detergo</h1>
    <p>Obsidian Dark · Slash &amp; Spark</p>
    <div class="actions">
      <button onclick="downloadSVG()">SVG indir</button
      ><button onclick="downloadPNG()">PNG indir (1024 × 1024)</button>
    </div>
    <script>
      const svgElement = document.querySelector("#icon svg");
      function getSVG() {
        const clone = svgElement.cloneNode(true);
        clone.setAttribute("width", "512");
        clone.setAttribute("height", "512");
        return new XMLSerializer().serializeToString(clone);
      }
      function downloadBlob(blob, name) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      function downloadSVG() {
        downloadBlob(
          new Blob([getSVG()], { type: "image/svg+xml;charset=utf-8" }),
          "detergo-icon-v2.svg",
        );
      }
      function downloadPNG() {
        const svgBlob = new Blob([getSVG()], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(svgBlob);
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = 1024;
          canvas.height = 1024;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, 1024, 1024);
          canvas.toBlob((blob) => {
            if (blob) downloadBlob(blob, "detergo-icon-v2.png");
            URL.revokeObjectURL(url);
          }, "image/png");
        };
        img.onerror = () => URL.revokeObjectURL(url);
        img.src = url;
      }
    </script>
  </body>
</html>
