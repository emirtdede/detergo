<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dc-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="dc-core-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="dc-star-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="dc-glow-2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Squircle Base -->
  <rect x="12" y="12" width="96" height="96" rx="26" fill="url(#dc-core-2)" stroke="url(#dc-grad-2)" stroke-width="5" />
  <!-- Terminal Prompt >_ -->
  <path d="M32 40 L52 60 L32 80" fill="none" stroke="url(#dc-grad-2)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="58" y1="80" x2="82" y2="80" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" />
  <!-- Pristine Clean Star (Sanitizer) -->
  <path d="M82 30 C82 40 90 47 100 47 C90 47 82 54 82 64 C82 54 74 47 64 47 C74 47 82 40 82 30 Z" fill="url(#dc-star-2)" filter="url(#dc-glow-2)" />
