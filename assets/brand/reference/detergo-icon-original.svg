<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
    <!-- Detergo (Slash & Spark) — Obsidian Dark App Icon -->
    <defs>
        <linearGradient id="bg-grad-1-dark" x1="256" y1="32" x2="256" y2="480" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1C1C21"/>
            <stop offset="45%" stop-color="#0D0D10"/>
            <stop offset="100%" stop-color="#050507"/>
        </linearGradient>
        <linearGradient id="rim-grad-1-dark" x1="256" y1="32" x2="256" y2="480" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
            <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
        </linearGradient>
    </defs>

    <!-- Base Obsidian Squircle -->
    <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg-grad-1-dark)"/>

    <!-- Inner Specular Rim Highlight -->
    <rect x="34" y="34" width="444" height="444" rx="106" stroke="url(#rim-grad-1-dark)" stroke-width="4"/>

    <!-- Subtle Inner Technical Track -->
    <rect x="56" y="56" width="400" height="400" rx="86" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2"/>

    <!-- Left Angle Bracket (<) moved farther left -->
    <path d="M166 172L86 256L166 340" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Angle Bracket (>) moved farther right -->
    <path d="M346 172L426 256L346 340" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Forward Slash (/) shortened by 8%, center unchanged -->
    <path d="M225.5 336.1L259.6 246.5" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>

    <!-- Single 4-Point Spark (✦), 12% larger at same center (283.4,184) -->
    <path d="M283.4 146C283.4 173.8 293.6 184 321.4 184C293.6 184 283.4 194.2 283.4 222C283.4 194.2 273.2 184 245.4 184C273.2 184 283.4 173.8 283.4 146Z" fill="#FFFFFF"/>
</svg>
