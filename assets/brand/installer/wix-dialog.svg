<svg xmlns="http://www.w3.org/2000/svg" width="493" height="312" viewBox="0 0 493 312" fill="none">
    <defs>
        <linearGradient id="wd-bg" x1="0" y1="0" x2="353" y2="312" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF"/>
            <stop offset="0.7" stop-color="#F6F6F9"/>
            <stop offset="1" stop-color="#EAEBF0"/>
        </linearGradient>
        <linearGradient id="wd-panel" x1="353" y1="0" x2="493" y2="312" gradientUnits="userSpaceOnUse">
            <stop stop-color="#191920"/>
            <stop offset="0.55" stop-color="#0A0A0D"/>
            <stop offset="1" stop-color="#050507"/>
        </linearGradient>
        <linearGradient id="wd-icon-bg" x1="256" y1="32" x2="256" y2="480" gradientUnits="userSpaceOnUse">
            <stop stop-color="#232329"/>
            <stop offset="0.45" stop-color="#101014"/>
            <stop offset="1" stop-color="#050507"/>
        </linearGradient>
        <linearGradient id="wd-icon-rim" x1="256" y1="32" x2="256" y2="480" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF" stop-opacity="0.38"/>
            <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.08"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
        </linearGradient>
        <linearGradient id="wd-word" x1="423" y1="188" x2="423" y2="224" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#C9CDD4"/>
        </linearGradient>
        <g id="wd-icon">
            <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#wd-icon-bg)"/>
            <rect x="34" y="34" width="444" height="444" rx="106" stroke="url(#wd-icon-rim)" stroke-width="4"/>
            <path d="M166 172L86 256L166 340" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M346 172L426 256L346 340" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M225.5 336.1L259.6 246.5" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
            <path d="M283.4 146C283.4 173.8 293.6 184 321.4 184C293.6 184 283.4 194.2 283.4 222C283.4 194.2 273.2 184 245.4 184C273.2 184 283.4 173.8 283.4 146Z" fill="#FFFFFF"/>
        </g>
        <g id="wd-glyph">
            <path d="M166 172L86 256L166 340" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M346 172L426 256L346 340" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M225.5 336.1L259.6 246.5" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
            <path d="M283.4 146C283.4 173.8 293.6 184 321.4 184C293.6 184 283.4 194.2 283.4 222C283.4 194.2 273.2 184 245.4 184C273.2 184 283.4 173.8 283.4 146Z" fill="#FFFFFF"/>
        </g>
    </defs>

    <rect width="353" height="312" fill="url(#wd-bg)"/>
    <rect x="353" width="140" height="312" fill="url(#wd-panel)"/>
    <rect x="353" width="1" height="312" fill="#000000" fill-opacity="0.16"/>

    <!-- Brand lockup inside the side panel -->
    <use href="#wd-icon" transform="translate(387 78) scale(0.160714) translate(-32 -32)"/>

    <text x="423" y="209" text-anchor="middle" font-family="Segoe UI, Segoe UI Semibold, Arial, sans-serif" font-size="15.5" font-weight="700" letter-spacing="2.8" fill="url(#wd-word)">DETERGO</text>
    <!-- No tagline here: at 140 px wide the 26-character line would need ~5 px
         type, which renders as a smear. Same rule as the NSIS header. -->

    <rect x="396" y="236" width="54" height="1" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="413" y="235.5" width="20" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.65"/>

    <!-- Faint glyph texture on the light side -->
    <use href="#wd-glyph" transform="translate(24 236) scale(0.16) translate(-32 -32)" opacity="0.04"/>
</svg>
