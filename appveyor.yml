# Continuous integration and release pipeline.
#
# AppVeyor is the only CI for this project. GitHub Actions is not used: the
# account has no payment method on file, so every Actions job is refused before
# its first step ("The job was not started because your account is locked due to
# a billing issue"), and no amount of public-repo minutes lifts that lock.
# AppVeyor builds open-source projects for free, including Windows images, so
# the same gates run there instead.
#
# Setup, once:
#   1. https://ci.appveyor.com -> sign in with GitHub -> New project -> this repo.
#   2. Project settings -> Environment -> add a variable named `github_token`
#      holding a GitHub personal access token with the `repo` scope, marked
#      "secure". It is used only by the tag deployment below.
#   3. Tag a release: `git tag -a v1.0.1 -m "..." && git push origin v1.0.1`.
#      The build runs, `release_output/` is produced and the GitHub Release is
#      created for that tag with the installers attached.

version: 1.0.{build}

image:
  - Ubuntu
  - Visual Studio 2022

# Third-party installs are pinned through package-lock.json / Cargo.lock, so a
# cached restore is safe and keeps a build near the previous duration.
cache:
  - node_modules -> package-lock.json
  - src-tauri/target -> src-tauri/Cargo.lock

for:
  # ---------------------------------------------------------------- Linux ----
  - matrix:
      only:
        - image: Ubuntu
    install:
      - npm ci
      - npm run check-version
    build_script:
      - npm run typecheck
      - npm test
      - npm run build
      - npm run check:gates
      - npm run check:audit
      - npm run check:i18n
      - npm run check:contrast
      - npm run check:icons
      - npm run check:brand
      - npm run format:check
      - npx playwright install --with-deps chromium
      - npx playwright test
    # Traces make a visual failure debuggable instead of a red cross.
    artifacts:
      - path: test-results
        name: playwright-trace
        optional: true

  # -------------------------------------------------------------- Windows ----
  - matrix:
      only:
        - image: Visual Studio 2022
    install:
      - npm ci
      - rustup component add rustfmt clippy
    build_script:
      # `--locked` makes CI build the committed dependency graph; a Cargo.toml
      # edit without a lock update fails here instead of drifting.
      - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - cargo check --locked --manifest-path src-tauri/Cargo.toml
      - cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - cargo test --locked --manifest-path src-tauri/Cargo.toml
      # The generated TypeScript contract must match the Rust IPC types.
      - cargo run --locked --manifest-path src-tauri/Cargo.toml --features bindings --bin export_bindings -- --check
    # A tag build also produces the installers and the provenance manifest. A
    # branch build skips this so a normal push stays fast.
    after_build:
      - ps: |
          if ($env:APPVEYOR_REPO_TAG -eq "true") {
            npm run build:release
            npm run check:build-info
          }
    artifacts:
      - path: release_output\*.exe
        optional: true
      - path: release_output\*.msi
        optional: true
      - path: release_output\SHA256SUMS.txt
        optional: true
      - path: release_output\BUILD_INFO.json
        optional: true
    # Attach the installers to the GitHub Release for the pushed tag. The
    # release is created from the tag; `docs/CHANGELOG.md` holds the notes.
    deploy:
      - provider: GitHub
        release: $(APPVEYOR_REPO_TAG_NAME)
        description: "See docs/CHANGELOG.md in the repository."
        auth_token:
          secure: $(github_token)
        artifact: /Dev-Cleaner-.*\.(exe|msi)|SHA256SUMS\.txt|BUILD_INFO\.json/
        draft: false
        prerelease: false
        force_update: true
        on:
          appveyor_repo_tag: true

# A pull request must fail for the same reasons it would anywhere else.
test: off
